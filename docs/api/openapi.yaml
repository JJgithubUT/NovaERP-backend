        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [Compras]
      summary: Registrar orden de compra
      description: Si el total supera el umbral del tenant, nace en pendiente_aprobacion.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [proveedor_id, lineas]
              properties:
                proveedor_id: { type: string, format: uuid }
                lineas:
                  type: array
                  items:
                    type: object
                    required: [producto_id, cantidad, costo_unitario]
                    properties:
                      producto_id: { type: string, format: uuid }
                      cantidad: { type: string }
                      costo_unitario: { type: string }
      responses:
        "201": { description: Orden creada., content: { application/json: { schema: { $ref: "#/components/schemas/OrdenCompra" } } } }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/BusinessError" }
  /api/compras/ordenes/{id}/:
    parameters: [ { $ref: "#/components/parameters/idPath" } ]
    get:
      tags: [Compras]
      summary: Detalle de orden
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/OrdenCompra" } } } }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      tags: [Compras]
      summary: Editar orden (o aprobar pendiente → enviada)
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                proveedor_id: { type: string, format: uuid }
                lineas: { type: array, items: { type: object } }
                estado: { type: string, enum: [enviada], description: "pendiente_aprobacion → enviada (aprobación manual)" }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/OrdenCompra" } } } }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/BusinessError" }
  /api/compras/ordenes/{id}/cancelar/:
    parameters: [ { $ref: "#/components/parameters/idPath" } ]
    post:
      tags: [Compras]
      summary: Cancelar orden de compra
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/OrdenCompra" } } } }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/BusinessError" }
