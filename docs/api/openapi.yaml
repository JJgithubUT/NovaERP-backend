        "201": { description: Movimiento aplicado., content: { application/json: { schema: { $ref: "#/components/schemas/Movimiento" } } } }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/BusinessError" }
  /api/inventario/ajustes/:
