      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [tipo, producto_id, almacen_id, cantidad]
              properties:
                tipo: { type: string, enum: [entrada, salida] }
                producto_id: { type: string, format: uuid }
                almacen_id: { type: string, format: uuid }
                cantidad: { type: string }
                costo_unitario: { type: string }
