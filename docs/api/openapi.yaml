      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Proveedor" } } } }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/BusinessError" }
    delete:
