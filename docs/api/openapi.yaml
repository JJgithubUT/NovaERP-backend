    get:
      tags: [Inventario]
      summary: Stock disponible (cantidad − reservado) por producto/almacén
      description: >
        Los filtros por id se traducen internamente al `sku` y al nombre del
        almacén, que es lo que expone la vista SQL. Un id inexistente o de otro
        tenant devuelve una página vacía, no un 404.
      parameters:
        - { $ref: "#/components/parameters/page" }
        - { $ref: "#/components/parameters/pageSize" }
        - { name: producto_id, in: query, schema: { type: string, format: uuid } }
        - { name: almacen_id, in: query, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Página de existencias.
          content:
            application/json:
              schema:
                allOf:
                  - { $ref: "#/components/schemas/Pagina" }
                  - type: object
                    properties: { results: { type: array, items: { $ref: "#/components/schemas/StockDisponible" } } }
        "400": { $ref: "#/components/responses/ParametroInvalido" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /api/inventario/kardex/:
    get:
      tags: [Inventario]
      summary: Kardex (bitácora inmutable de movimientos)
      description: >
        `producto_id` / `almacen_id` se traducen al `sku` y al nombre del almacén
        (las columnas reales de la vista); `sku`, `almacen` y `tipo` filtran
        directamente sobre ellas. `desde` / `hasta` acotan por `ocurrido_en`.
      parameters:
        - { $ref: "#/components/parameters/page" }
        - { $ref: "#/components/parameters/pageSize" }
        - { name: producto_id, in: query, schema: { type: string, format: uuid } }
        - { name: almacen_id, in: query, schema: { type: string, format: uuid } }
        - { name: sku, in: query, schema: { type: string } }
        - { name: almacen, in: query, schema: { type: string }, description: Nombre exacto del almacén. }
        - { name: tipo, in: query, schema: { $ref: "#/components/schemas/TipoMovimiento" } }
        - { name: desde, in: query, schema: { type: string, format: date } }
        - { name: hasta, in: query, schema: { type: string, format: date } }
      responses:
        "200":
          description: Página de kardex.
          content:
            application/json:
              schema:
                allOf:
                  - { $ref: "#/components/schemas/Pagina" }
                  - type: object
                    properties: { results: { type: array, items: { $ref: "#/components/schemas/FilaKardex" } } }
        "400": { $ref: "#/components/responses/ParametroInvalido" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /api/inventario/valuacion/:
    get:
      tags: [Inventario]
      summary: Valuación del inventario (cantidad × costo)
      parameters:
        - { $ref: "#/components/parameters/page" }
        - { $ref: "#/components/parameters/pageSize" }
        - { name: producto_id, in: query, schema: { type: string, format: uuid } }
        - { name: almacen_id, in: query, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Página de valuación.
          content:
            application/json:
              schema:
                allOf:
                  - { $ref: "#/components/schemas/Pagina" }
                  - type: object
                    properties: { results: { type: array, items: { $ref: "#/components/schemas/FilaValuacion" } } }
        "400": { $ref: "#/components/responses/ParametroInvalido" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /api/inventario/alertas-stock-minimo/:
    get:
      tags: [Inventario]
      summary: Alertas de stock por debajo del mínimo
      description: Las alertas las genera el trigger de inventario; la API no las crea.
      parameters:
        - { $ref: "#/components/parameters/page" }
        - { $ref: "#/components/parameters/pageSize" }
        - { name: producto_id, in: query, schema: { type: string, format: uuid } }
        - { name: almacen_id, in: query, schema: { type: string, format: uuid } }
        - { name: notificada, in: query, schema: { type: boolean } }
      responses:
        "200":
          description: Página de alertas.
          content:
            application/json:
              schema:
                allOf:
                  - { $ref: "#/components/schemas/Pagina" }
                  - type: object
                    properties: { results: { type: array, items: { $ref: "#/components/schemas/AlertaStockMinimo" } } }
        "400": { $ref: "#/components/responses/ParametroInvalido" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /api/inventario/alertas-stock-minimo/{id}/notificar/:
    parameters: [ { name: id, in: path, required: true, schema: { type: integer }, description: "Entero, no UUID: la alerta usa un id secuencial." } ]
    post:
      tags: [Inventario]
      summary: Marcar una alerta como notificada
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/AlertaStockMinimo" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Token obtenido de /api/auth/otp/ (tenant) o /api/admin/login/ (SysAdmin).

  parameters:
    page: { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
    pageSize: { name: page_size, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
    idPath: { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    # Reportes de ventas (RV-01..06)
    repDesde:
      name: desde
      in: query
      required: true
      schema: { type: string, format: date }
      description: Obligatorio. El rango no puede exceder 366 días.
    repHasta:
      name: hasta
      in: query
      required: true
      schema: { type: string, format: date }
      description: Obligatorio, y no anterior a `desde`.
    repFormato:
      name: formato
      in: query
      schema: { type: string, enum: [csv, pdf] }
      description: >
        Sin este parámetro devuelve JSON. Con él devuelve el archivo del reporte
        completo y exige el permiso ventas:reportes:exportar (403 si falta).
    repVendedor:
      name: vendedor_id
      in: query
      schema: { type: string, format: uuid }
      description: >
        Solo lo respeta quien tiene ventas:pipeline:ver_todo. Sin ese permiso el
        reporte se acota siempre al propio usuario, se pida lo que se pida; la
        respuesta lo indica en `alcance_vendedor`.
    repLimit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 10 }
      description: Tamaño del top. No afecta a `totales`, que agregan todo el rango.

  responses:
    Unauthorized:
      description: No autenticado o sesión expirada/revocada.
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" }, example: { detail: "No autorizado o sesion expirada" } } }
    AuthUnauthorized:
      description: Credenciales inválidas / cuenta bloqueada / inactiva.
      content: { application/json: { schema: { $ref: "#/components/schemas/ErrorAuth" } } }
    AuthBadRequest:
      description: JSON inválido o faltan campos obligatorios.
      content: { application/json: { schema: { $ref: "#/components/schemas/ErrorAuth" } } }
    JsonInvalido:
      description: >
        El cuerpo no es JSON válido. Se distingue del 422 (JSON bien formado que
        rompe una regla de negocio) y del 400 de los reportes, que es un
        parámetro de consulta mal formado.
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" }, example: { detail: "JSON invalido." } } }
    Forbidden:
      description: Autenticado pero sin el permiso requerido.
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" }, example: { detail: "No cuenta con permisos para esta operacion", permiso_requerido: "ventas:pedidos:crear" } } }
    NotFound:
      description: No encontrado (o pertenece a otro tenant).
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" }, example: { detail: "No encontrado" } } }
    BusinessError:
      description: Violación de una regla de negocio.
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" }, example: { detail: "cantidad excede lo pendiente de facturar.", campo: "lineas[0].cantidad", maximo_facturable: "2.000" } } }
    ParametroInvalido:
      description: >
        Parámetro de consulta mal formado: valor fuera del catálogo de un enum,
        UUID que no es un UUID, fecha que no es fecha, limit no numérico, o falta
        uno obligatorio. `campo` señala cuál. Se distingue del 422, que es una
        petición bien formada que rompe una regla de negocio.

        Un id **bien formado** que no existe (o es de otro tenant) no es un 400:
        devuelve una página vacía, para no revelar qué existe en otros tenants.
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" }, example: { detail: "agrupar debe ser uno de: dia, semana, mes.", campo: "agrupar" } } }

  schemas:
    Error:
      type: object
      description: Envelope de error estándar (todo excepto /api/auth/*).
      properties:
        detail: { type: string }
        campo: { type: string, description: "Solo en 422: campo del formulario en conflicto" }
        permiso_requerido: { type: string, description: "Solo en 403 cuando aplica" }
      additionalProperties: true
    ErrorAuth:
      type: object
      description: Envelope de error de los endpoints de autenticación (usa 'mensaje').
      properties:
        mensaje: { type: string }
    Pagina:
      type: object
      properties:
        count: { type: integer }
        page: { type: integer }
        page_size: { type: integer }
        num_pages: { type: integer }
        results: { type: array, items: {} }

    SobreReporte:
      type: object
      description: >
        Sobre común de los reportes de ventas. NO es el sobre paginado de los
        listados: un agregado no es una página. Los importes son decimales en
        string; parsearlos con librería decimal, nunca como float.
      properties:
        rango:
          type: object
          properties:
            desde: { type: string, format: date }
            hasta: { type: string, format: date }
        filtros:
          type: object
          additionalProperties: true
          description: Eco de los filtros recibidos (null los no enviados).
        alcance_vendedor:
          type: [string, "null"]
          format: uuid
          description: >
            A qué vendedor quedó acotado el reporte de verdad. null = toda la
            organización. Un usuario sin ventas:pipeline:ver_todo lo verá siempre
            con su propio id, aunque haya pedido otro en ?vendedor_id=.
        totales:
          type: object
          additionalProperties: true
          description: Agregado de TODO el rango, sin recortar por ?limit=.
        resultados: { type: array, items: {} }
        nota:
          type: string
          description: Advertencia metodológica del reporte, cuando la tiene.
        generado_en: { type: string, format: date-time }

    Me:
      type: object
      properties:
        usuario:
          type: object
          properties:
            id: { type: string, format: uuid }
            nombre_completo: { type: string }
            correo: { type: string }
            estado: { $ref: "#/components/schemas/EstadoUsuario" }
            mfa_enrolado: { type: boolean }
            ultimo_acceso: { type: string, format: date-time, nullable: true }
        tenant:
          type: object
          properties:
            id: { type: string, format: uuid }
            slug: { type: string }
            razon_social: { type: string }
            estado: { $ref: "#/components/schemas/EstadoTenant" }
            plan: { type: string }
        roles: { type: array, items: { type: string } }
        es_admin: { type: boolean }
        permisos:
          type: array
          items:
            type: object
            properties:
              codigo: { type: string }
              dominio: { type: string }
              recurso: { type: string }
              accion: { type: string }
        modulos:
          type: array
          items:
            type: object
            properties:
              codigo: { type: string }
              nombre: { type: string }
              fase: { type: integer }

    Cliente:
      type: object
      properties:
        id: { type: string, format: uuid }
        rfc_o_id_fiscal: { type: string, nullable: true }
        razon_social: { type: string }
        correo: { type: string, nullable: true }
        telefono: { type: string, nullable: true }
        limite_credito: { type: string }
        activo: { type: boolean }
    ClienteInput:
      type: object
      required: [razon_social]
      properties:
        rfc_o_id_fiscal: { type: string }
        razon_social: { type: string }
        correo: { type: string }
        telefono: { type: string }
        limite_credito: { type: string, description: ">= 0" }

    Oportunidad:
      type: object
      properties:
        id: { type: string, format: uuid }
        cliente_id: { type: string, format: uuid }
        nombre: { type: string }
        valor_estimado: { type: string, nullable: true }
        fecha_cierre_estimada: { type: string, format: date, nullable: true }
        etapa: { $ref: "#/components/schemas/EtapaOportunidad" }
        estado: { type: string, enum: [abierta, ganada, perdida] }
        probabilidad: { type: integer, description: Derivada de la etapa (0–100) }
        valor_ponderado: { type: string }
        motivo_perdida: { type: string, nullable: true }
        responsable_id: { type: string, format: uuid, nullable: true }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    Cotizacion:
      type: object
      properties:
        id: { type: string, format: uuid }
        folio: { type: string }
        cliente_id: { type: string, format: uuid }
        oportunidad_id: { type: string, format: uuid, nullable: true }
        vendedor_id: { type: string, format: uuid, nullable: true, description: Atribución comercial; alimenta RV-06. }
        estado: { $ref: "#/components/schemas/EstadoCotizacion" }
        vencida: { type: boolean, description: Derivada de vigente_hasta }
        subtotal: { type: string }
        descuento_pct: { type: string }
        total: { type: string }
        vigente_hasta: { type: string, format: date, nullable: true }
        lineas: { type: array, items: { $ref: "#/components/schemas/CotizacionLinea" } }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    CotizacionLinea:
      type: object
      properties:
        id: { type: string, format: uuid }
        producto_id: { type: string, format: uuid }
        descripcion: { type: string }
        cantidad: { type: string }
        precio_unitario: { type: string }
        importe: { type: string, description: Calculado (cantidad × precio) }
    CotizacionLineaInput:
      type: object
      required: [producto_id, cantidad]
      properties:
        producto_id: { type: string, format: uuid }
        cantidad: { type: string }
        precio_unitario: { type: string, description: Opcional; ajuste manual requiere permiso }
        descripcion: { type: string, description: Opcional; default el nombre del producto }

    Pedido:
      type: object
      properties:
        id: { type: string, format: uuid }
        folio: { type: string }
        cliente_id: { type: string, format: uuid }
        cotizacion_id: { type: string, format: uuid, nullable: true }
        almacen_id: { type: string, format: uuid, nullable: true }
        vendedor_id: { type: string, format: uuid, nullable: true, description: Atribución comercial; alimenta RV-06. }
        estado: { $ref: "#/components/schemas/EstadoPedido" }
        total: { type: string }
        lineas:
          type: array
          items:
            type: object
            properties:
              id: { type: string, format: uuid }
              producto_id: { type: string, format: uuid }
              cantidad: { type: string }
              cantidad_facturada: { type: string }
              cantidad_reservada: { type: string }
              precio_unitario: { type: string }
              pendiente_facturar: { type: string }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    Factura:
      type: object
      properties:
        id: { type: string, format: uuid }
        folio: { type: string }
        pedido_id: { type: string, format: uuid }
        cliente_id: { type: string, format: uuid }
        vendedor_id: { type: string, format: uuid, nullable: true, description: Atribución comercial; alimenta RV-06. }
        estado: { $ref: "#/components/schemas/EstadoFactura" }
        subtotal: { type: string }
        impuestos: { type: string }
        total: { type: string }
        fecha_emision: { type: string, format: date-time }
        cxc_saldo: { type: string, nullable: true, description: Saldo actual de la cuenta por cobrar }
        lineas:
          type: array
          items:
            type: object
            properties:
              id: { type: string, format: uuid }
              pedido_linea_id: { type: string, format: uuid }
              cantidad: { type: string }
              precio_unitario: { type: string }
              importe: { type: string }

    # ── Núcleo ──
    Usuario:
      type: object
      properties:
        id: { type: string, format: uuid }
        correo: { type: string }
        nombre_completo: { type: string }
        telefono: { type: string, nullable: true }
        puesto: { type: string, nullable: true }
        departamento: { type: string, nullable: true }
        estado: { $ref: "#/components/schemas/EstadoUsuario" }
        mfa_enrolado: { type: boolean, description: "No viene en las filas del directorio (GET /api/core/usuarios/)" }
        roles: { type: array, items: { type: string } }
        ultimo_acceso: { type: string, format: date-time, nullable: true, description: "Solo en el directorio" }
        created_at: { type: string, format: date-time }
    Rol:
      type: object
      properties:
        id: { type: string, format: uuid }
        nombre: { type: string }
        es_sistema: { type: boolean }
        activo: { type: boolean }
        acceso_total: { type: boolean, description: "true = rol de sistema (bypass), autoriza todo" }
        usuarios_asignados: { type: integer }
        permisos:
          type: array
          description: Permisos agrupados por dominio.
          items:
            type: object
            properties:
              dominio: { type: string }
              permisos: { type: array, items: { type: object, properties: { codigo: { type: string }, inerte: { type: boolean } } } }
        created_at: { type: string, format: date-time }
    Sesion:
      type: object
      properties:
        id: { type: string, format: uuid }
        jti: { type: string }
        dispositivo: { type: string, nullable: true, description: User-Agent }
        ip_origen: { type: string, nullable: true }
        iniciada_en: { type: string, format: date-time }
        ultima_actividad: { type: string, format: date-time }
        expira_en: { type: string, format: date-time }
        actual: { type: boolean }
    ConfigSeguridad:
      type: object
      properties:
        politica_password_min_len: { type: integer }
        politica_password_regex: { type: string, nullable: true }
        jwt_expiracion_horas: { type: integer }
        intentos_max_ventana: { type: integer }
        ventana_minutos: { type: integer }
        bloqueo_minutos: { type: integer }
        updated_at: { type: [string, "null"], format: date-time, description: "null si el tenant todavía no ha guardado su política (se devuelven los valores por defecto)." }
        limites_plataforma:
          type: object
          description: "Rango permitido por la plataforma en cada campo; el formulario debe validar contra esto."
          additionalProperties:
            type: object
            properties:
              min: { type: integer }
              max: { type: integer }
    ConfigSeguridadInput:
      type: object
      properties:
        politica_password_min_len: { type: integer }
        politica_password_regex: { type: string }
        jwt_expiracion_horas: { type: integer }
        intentos_max_ventana: { type: integer }
        ventana_minutos: { type: integer }
        bloqueo_minutos: { type: integer }
    RolesDeUsuario:
      type: object
      description: Conjunto de roles vigentes de un usuario tras asignar o revocar.
      properties:
        usuario_id: { type: string, format: uuid }
        roles:
          type: array
          items:
            type: object
            properties:
              id: { type: string, format: uuid }
              nombre: { type: string }
              activo: { type: boolean }
              es_sistema: { type: boolean }
    Permiso:
      type: object
      description: Entrada del catálogo maestro. El código es "dominio:recurso:accion".
      properties:
        codigo: { type: string, example: "inventario:productos:crear" }
        dominio: { type: string }
        recurso: { type: string }
        accion: { type: string }
        descripcion: { type: string, nullable: true }
        inerte: { type: boolean, description: "true = su módulo está desactivado en el tenant: no se puede elegir y no autoriza nada." }
    ActividadUsuario:
      type: object
      description: Fila del reporte de actividad (RF-23).
      properties:
        usuario_id: { type: string, format: uuid }
        nombre_completo: { type: string }
        correo: { type: string }
        departamento: { type: string, nullable: true }
        puesto: { type: string, nullable: true }
        estado: { $ref: "#/components/schemas/EstadoUsuario" }
        ultimo_acceso: { type: string, format: date-time, nullable: true }
        num_sesiones: { type: integer }
        num_acciones_cud: { type: integer, description: Acciones INSERT/UPDATE/DELETE auditadas en el rango. }
    EventoAuditoria:
      type: object
      properties:
        id: { type: integer }
        usuario_id: { type: string, format: uuid, nullable: true }
        entidad: { type: string }
        entidad_id: { type: string }
        operacion: { type: string, description: "CREATE/UPDATE/DELETE/LOGIN/LOGIN_FAILED/…" }
        criticidad: { type: string, enum: [BAJA, NORMAL, ALTA] }
        ip_origen: { type: string, nullable: true }
        ocurrido_en: { type: string, format: date-time }
        valores_antes:
          type: [object, "null"]
          additionalProperties: true
          description: Fila anterior al cambio, tal como la guardó el trigger fn_auditar. Null en INSERT y en eventos de sesión.
        valores_despues:
          type: [object, "null"]
          additionalProperties: true
          description: Fila resultante. Null en DELETE y en eventos de sesión.

    # ── Plataforma ──
    Tenant:
      type: object
      properties:
        id: { type: string, format: uuid }
        slug: { type: string }
        razon_social: { type: string }
        dominio_comercial: { type: string }
        plan: { type: object, properties: { codigo: { type: string }, nombre: { type: string }, licencias_max: { type: integer } } }
        estado: { $ref: "#/components/schemas/EstadoTenant" }
        motivo_suspension: { type: string, nullable: true }
        modulos_activos:
          description: "Solo en el detalle (RF-02/CA05)."
          type: array
          items:
            type: object
            properties:
              codigo: { type: string }
              nombre: { type: string }
              fase: { type: integer }
        usuarios:
          description: "Solo en el detalle. Las licencias las consumen los usuarios pendientes, pendiente_verificacion y activos; un suspendido no consume."
          type: object
          properties:
            registrados: { type: integer }
            licencias_consumidas: { type: integer }
            licencias_max: { type: integer }
        admin_inicial:
          description: "Solo al registrar el tenant y al activarlo; `nombre_completo` únicamente en el registro."
          type: object
          properties:
            id: { type: string, format: uuid }
            correo: { type: string }
            nombre_completo: { type: string }
            estado: { $ref: "#/components/schemas/EstadoUsuario" }
        activacion_token: { type: string, description: "Solo al registrar: en claro una única vez." }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    # ── Compras ──
    Proveedor:
      type: object
      properties:
        id: { type: string, format: uuid }
        rfc_o_id_fiscal: { type: string, nullable: true }
        razon_social: { type: string }
        correo: { type: string, nullable: true }
        telefono: { type: string, nullable: true }
        activo: { type: boolean }
    OrdenCompra:
      type: object
      properties:
        id: { type: string, format: uuid }
        folio: { type: string }
        proveedor_id: { type: string, format: uuid }
        estado: { $ref: "#/components/schemas/EstadoOrdenCompra" }
        total: { type: string }
        lineas:
          type: array
          items:
            type: object
            properties:
              id: { type: string, format: uuid }
              producto_id: { type: string, format: uuid }
              cantidad: { type: string }
              cantidad_recibida: { type: string }
              costo_unitario: { type: string }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    ConfigAprobacion:
      type: object
      properties:
        tenant_id: { type: string, format: uuid }
        umbral_monto: { type: string }
    ConfigAprobacionInput:
      type: object
      properties:
        umbral_monto: { type: string, description: "Decimal >= 0. Una orden que lo supera nace en pendiente_aprobacion." }
    CuentaPorPagar:
      type: object
      properties:
        id: { type: string, format: uuid }
        proveedor_id: { type: string, format: uuid }
        origen_tipo: { type: string, description: "Documento que la originó (p. ej. recepcion_mercancia)." }
        origen_id: { type: string }
        monto_original: { type: string }
        saldo: { type: string }
        created_at: { type: string, format: date-time }
    Recepcion:
      type: object
      properties:
        id: { type: string, format: uuid }
        orden_id: { type: string, format: uuid }
        almacen_id: { type: string, format: uuid }
        recibido_por: { type: string, format: uuid, nullable: true }
        lineas:
          type: array
          items:
            type: object
            properties:
              id: { type: string, format: uuid }
              orden_compra_linea_id: { type: string, format: uuid }
              cantidad: { type: string }
              costo_unitario: { type: string }
        created_at: { type: string, format: date-time }

    # ── Inventario ──
    Producto:
      type: object
      properties:
        id: { type: string, format: uuid }
        sku: { type: string }
        nombre: { type: string }
        descripcion: { type: string, nullable: true }
        costo_referencia: { type: string }
        precio_venta: { type: string }
        stock_minimo: { type: string }
        activo: { type: boolean }
    Almacen:
      type: object
      properties:
        id: { type: string, format: uuid }
        nombre: { type: string }
        ubicacion: { type: string, nullable: true }
        activo: { type: boolean }
    Movimiento:
      type: object
      properties:
        id: { type: integer }
        producto_id: { type: string, format: uuid }
        almacen_id: { type: string, format: uuid }
        tipo: { $ref: "#/components/schemas/TipoMovimiento" }
        cantidad: { type: string }
        costo_unitario: { type: string, nullable: true }
        referencia_tipo: { type: string, nullable: true }
        referencia_id: { type: string, nullable: true }
        ocurrido_en: { type: string, format: date-time }
    AjusteInventario:
      type: object
      properties:
        id: { type: string, format: uuid }
        producto_id: { type: string, format: uuid }
        almacen_id: { type: string, format: uuid }
        motivo: { type: string, enum: [conteo_fisico, merma, otro] }
        cantidad: { type: string, description: "Positivo suma, negativo resta (≠ 0)." }
        aprobado_por: { type: string, format: uuid, nullable: true }
        created_at: { type: string, format: date-time }
    Transferencia:
      type: object
      properties:
        id: { type: string, format: uuid }
        producto_id: { type: string, format: uuid }
        almacen_origen_id: { type: string, format: uuid }
        almacen_destino_id: { type: string, format: uuid }
        cantidad: { type: string }
        created_at: { type: string, format: date-time }
    AlertaStockMinimo:
      type: object
      properties:
        id: { type: integer, description: "Secuencial, no UUID." }
        producto_id: { type: string, format: uuid }
        almacen_id: { type: string, format: uuid }
        cantidad_al_disparo: { type: string, description: Existencia en el momento en que se disparó, no la actual. }
        disparada_en: { type: string, format: date-time }
        notificada: { type: boolean }
    StockDisponible:
      type: object
      description: >
        Fila de la vista v_stock_disponible. Identifica el producto por `sku` y el
        almacén por su nombre: la vista no expone sus UUIDs (ver los filtros del
        endpoint).
      properties:
        sku: { type: string }
        producto: { type: string }
        almacen: { type: string }
        cantidad: { type: string }
        reservado: { type: string }
        disponible: { type: string }
    FilaKardex:
      type: object
      properties:
        movimiento_id: { type: integer, description: "Id del movimiento; la vista no tiene un `id` propio." }
        sku: { type: string }
        producto: { type: string }
        almacen: { type: string }
        tipo: { $ref: "#/components/schemas/TipoMovimiento" }
        cantidad: { type: string }
        costo_unitario: { type: string, nullable: true }
        referencia_tipo: { type: string, nullable: true }
        referencia_id: { type: string, nullable: true }
        ocurrido_en: { type: string, format: date-time }
    FilaValuacion:
      type: object
      properties:
        sku: { type: string }
        producto: { type: string }
        almacen: { type: string }
        cantidad: { type: string }
        costo_referencia: { type: string }
        valor_total: { type: string, description: cantidad × costo_referencia }

    # ── Enumeraciones ──
    EstadoTenant: { type: string, enum: [pendiente, activo, suspendido, baja_logica] }
    EstadoUsuario: { type: string, enum: [pendiente, activo, suspendido, pendiente_verificacion] }
    EtapaOportunidad: { type: string, enum: [prospeccion, calificacion, propuesta, negociacion, cierre] }
    EstadoCotizacion: { type: string, enum: [borrador, pendiente_aprobacion, aprobada, rechazada] }
    EstadoPedido: { type: string, enum: [borrador, confirmado, pendiente_surtido, cancelado, facturado_parcial, facturado_total] }
    EstadoFactura: { type: string, enum: [emitida, cancelada, con_nota_credito] }
    EstadoOrdenCompra: { type: string, enum: [pendiente_aprobacion, enviada, recibida_parcial, recibida_total, cancelada] }
    TipoMovimiento: { type: string, enum: [entrada, salida, ajuste_positivo, ajuste_negativo, transferencia_salida, transferencia_entrada] }
