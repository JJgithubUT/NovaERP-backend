                orden_id: { type: string, format: uuid }
                almacen_id: { type: string, format: uuid }
                lineas:
                  type: array
                  items:
                    type: object
                    required: [orden_compra_linea_id, cantidad]
                    properties:
                      orden_compra_linea_id: { type: string, format: uuid }
                      cantidad: { type: string }
      responses:
        "201": { description: Recepción registrada., content: { application/json: { schema: { $ref: "#/components/schemas/Recepcion" } } } }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/BusinessError" }
  /api/compras/cuentas-por-pagar/:
