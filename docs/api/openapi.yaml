        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/BusinessError" }

  # ═════════════════════════════════════════ Inventario
  /api/inventario/productos/:
    get:
      tags: [Inventario]
      summary: Catálogo de productos
      parameters:
        - { $ref: "#/components/parameters/page" }
        - { $ref: "#/components/parameters/pageSize" }
        - { name: search, in: query, schema: { type: string }, description: sku / nombre }
        - { name: activo, in: query, schema: { type: boolean } }
      responses:
        "200":
          description: Página de productos.
          content:
            application/json:
              schema:
                allOf:
                  - { $ref: "#/components/schemas/Pagina" }
                  - type: object
                    properties: { results: { type: array, items: { $ref: "#/components/schemas/Producto" } } }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [Inventario]
      summary: Registrar producto
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [sku, nombre, costo_referencia, precio_venta]
              properties:
                sku: { type: string }
                nombre: { type: string }
                descripcion: { type: string }
                costo_referencia: { type: string }
                precio_venta: { type: string }
                stock_minimo: { type: string }
      responses:
        "201": { description: Producto creado., content: { application/json: { schema: { $ref: "#/components/schemas/Producto" } } } }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/BusinessError" }
  /api/inventario/productos/{id}/:
    parameters: [ { $ref: "#/components/parameters/idPath" } ]
    patch:
      tags: [Inventario]
      summary: Editar producto
      requestBody: { content: { application/json: { schema: { $ref: "#/components/schemas/Producto" } } } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Producto" } } } }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/BusinessError" }
    delete:
      tags: [Inventario]
      summary: Descontinuar producto (baja lógica)
      responses:
        "200": { description: OK }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/inventario/almacenes/:
    get:
      tags: [Inventario]
