                motivo: { type: string, enum: [conteo_fisico, merma, otro] }
                producto_id: { type: string, format: uuid }
                almacen_id: { type: string, format: uuid }
                cantidad: { type: string, description: "Positivo o negativo (≠ 0)" }
      responses:
        "201": { description: Ajuste aplicado. }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/BusinessError" }
  /api/inventario/transferencias/:
    get:
      tags: [Inventario]
