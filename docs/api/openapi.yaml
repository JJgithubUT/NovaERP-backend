      parameters:
        - { $ref: "#/components/parameters/page" }
        - { $ref: "#/components/parameters/pageSize" }
        - { name: orden_id, in: query, schema: { type: string, format: uuid } }
        - { name: almacen_id, in: query, schema: { type: string, format: uuid } }
        - { name: desde, in: query, schema: { type: string, format: date }, description: Acota por created_at. }
        - { name: hasta, in: query, schema: { type: string, format: date } }
      responses:
        "200":
          description: Página de recepciones.
          content:
            application/json:
              schema:
                allOf:
                  - { $ref: "#/components/schemas/Pagina" }
                  - type: object
                    properties: { results: { type: array, items: { $ref: "#/components/schemas/Recepcion" } } }
        "400": { $ref: "#/components/responses/ParametroInvalido" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [Compras]
      summary: Registrar recepción de mercancía (suma stock, crea CxP)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [orden_id, almacen_id, lineas]
              properties:
                orden_id: { type: string, format: uuid }
                almacen_id: { type: string, format: uuid }
                lineas:
                  type: array
                  items:
                    type: object
                    required: [orden_compra_linea_id, cantidad]
                    properties:
                      orden_compra_linea_id: { type: string, format: uuid }
                      cantidad: { type: string, description: No puede exceder lo pendiente de la línea de la orden. }
                      costo_unitario:
                        type: string
                        description: >
                          Opcional, >= 0. Es el costo real facturado por el
                          proveedor y con él se recalcula `costo_referencia` del
