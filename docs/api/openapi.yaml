            application/json:
              schema:
                type: object
                properties:
                  proveedor_id: { type: string, format: uuid }
                  razon_social: { type: string }
                  ordenes: { type: array, items: { $ref: "#/components/schemas/OrdenCompra" } }
                  recepciones: { type: array, items: { $ref: "#/components/schemas/Recepcion" } }
                  cuentas_por_pagar: { type: array, items: { $ref: "#/components/schemas/CuentaPorPagar" } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
