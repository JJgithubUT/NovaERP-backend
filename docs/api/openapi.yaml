      parameters:
        - { $ref: "#/components/parameters/page" }
        - { $ref: "#/components/parameters/pageSize" }
        - { name: estado, in: query, schema: { $ref: "#/components/schemas/EstadoOrdenCompra" } }
        - { name: proveedor_id, in: query, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Página de órdenes.
          content:
            application/json:
              schema:
                allOf:
                  - { $ref: "#/components/schemas/Pagina" }
                  - type: object
