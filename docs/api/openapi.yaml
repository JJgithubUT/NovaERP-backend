      parameters: [ { $ref: "#/components/parameters/page" }, { $ref: "#/components/parameters/pageSize" } ]
      responses:
        "200": { description: Página de transferencias. }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [Inventario]
      summary: Registrar transferencia entre almacenes (salida + entrada atómica)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [producto_id, almacen_origen_id, almacen_destino_id, cantidad]
              properties:
                producto_id: { type: string, format: uuid }
                almacen_origen_id: { type: string, format: uuid }
                almacen_destino_id: { type: string, format: uuid }
                cantidad: { type: string }
      responses:
        "201": { description: Transferencia aplicada. }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/BusinessError" }
  /api/inventario/stock-disponible/:
    get:
      tags: [Inventario]
      summary: Stock disponible (cantidad − reservado) por producto/almacén
      parameters: [ { $ref: "#/components/parameters/page" }, { $ref: "#/components/parameters/pageSize" }, { name: producto_id, in: query, schema: { type: string, format: uuid } } ]
      responses:
        "200":
          description: Página de existencias.
          content:
            application/json:
              schema:
                allOf:
                  - { $ref: "#/components/schemas/Pagina" }
                  - type: object
                    properties: { results: { type: array, items: { $ref: "#/components/schemas/StockDisponible" } } }
        "403": { $ref: "#/components/responses/Forbidden" }
  /api/inventario/kardex/:
    get:
      tags: [Inventario]
      summary: Kardex (bitácora inmutable de movimientos)
      parameters: [ { $ref: "#/components/parameters/page" }, { $ref: "#/components/parameters/pageSize" }, { name: producto_id, in: query, schema: { type: string, format: uuid } }, { name: almacen_id, in: query, schema: { type: string, format: uuid } } ]
      responses:
        "200": { description: Página de kardex. }
        "403": { $ref: "#/components/responses/Forbidden" }
  /api/inventario/valuacion/:
    get:
      tags: [Inventario]
      summary: Valuación del inventario (cantidad × costo)
      parameters: [ { $ref: "#/components/parameters/page" }, { $ref: "#/components/parameters/pageSize" } ]
      responses:
        "200": { description: Página de valuación. }
        "403": { $ref: "#/components/responses/Forbidden" }
  /api/inventario/alertas-stock-minimo/:
    get:
      tags: [Inventario]
      summary: Alertas de stock por debajo del mínimo
