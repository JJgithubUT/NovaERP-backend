      tags: [Inventario]
      summary: Editar almacén
      requestBody: { content: { application/json: { schema: { $ref: "#/components/schemas/Almacen" } } } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Almacen" } } } }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [Inventario]
