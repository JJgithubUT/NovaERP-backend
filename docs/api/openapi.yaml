      responses:
        "200":
          description: Página de almacenes.
          content:
            application/json:
              schema:
                allOf:
                  - { $ref: "#/components/schemas/Pagina" }
                  - type: object
                    properties: { results: { type: array, items: { $ref: "#/components/schemas/Almacen" } } }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [Inventario]
      summary: Registrar almacén
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [nombre], properties: { nombre: { type: string }, ubicacion: { type: string } } }
      responses:
        "201": { description: Almacén creado., content: { application/json: { schema: { $ref: "#/components/schemas/Almacen" } } } }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/BusinessError" }
  /api/inventario/almacenes/{id}/:
    parameters: [ { $ref: "#/components/parameters/idPath" } ]
