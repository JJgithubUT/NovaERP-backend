    parameters: [ { $ref: "#/components/parameters/idPath" } ]
    get:
      tags: [Compras]
      summary: Historial de compras del proveedor
      description: >
        RF-51: órdenes, recepciones y cuentas por pagar del proveedor en un solo
        payload. No está paginado: es la ficha completa del proveedor.
      responses:
        "200":
